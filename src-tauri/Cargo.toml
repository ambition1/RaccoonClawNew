[package]
name = "raccoonclaw"
version = "1.0.0"
description = "RaccoonClaw OSS - AI Agent Orchestration Platform"
authors = ["RaccoonClaw Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
